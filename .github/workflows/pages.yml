name: Deploy landing page to GitHub Pages

# Publishes the static project page in site/ to GitHub Pages.
#
# NOTE: GitHub Pages requires either a PUBLIC repository or a paid plan
# (Pro/Team/Enterprise) on a private one. This repository is public.
#
# The configure-pages step below enables Pages automatically, so no manual
# setup is required. If it ever fails, set it by hand under
# Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight publish; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not already enabled,
          # so no manual Settings → Pages step is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
