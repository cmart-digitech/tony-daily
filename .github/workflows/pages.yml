name: Deploy landing page to GitHub Pages

# Publishes the static project page in site/ to GitHub Pages.
#
# NOTE: GitHub Pages requires either a PUBLIC repository or a paid plan
# (Pro/Team/Enterprise) on a private one. If this repo stays private on a
# free account, enabling Pages will fail — make the repo public, or move
# the site/ folder into its own public repository.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then this workflow publishes on every push.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight publish; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
