name: Deploy landing page to GitHub Pages

# Publishes the static project page in site/ to GitHub Pages.
#
# NOTE: GitHub Pages requires either a PUBLIC repository or a paid plan
# (Pro/Team/Enterprise) on a private one. This repository is public.
#
# ONE-TIME SETUP — already done for this repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# That switch cannot be flipped from a workflow: configure-pages with
# `enablement: true` fails with "Resource not accessible by integration",
# because enabling publishing is an admin action. It only needs doing once;
# every push to site/ now publishes automatically.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight publish; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
