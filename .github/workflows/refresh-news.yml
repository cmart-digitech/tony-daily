name: Refresh news

# Keeps the deployed dashboard fresh for free.
#
# Vercel's Hobby plan allows only ONE cron run per day, which covers the
# morning brief but leaves the rest of the day stale. GitHub Actions
# scheduled workflows are free for public repositories, so this job pings
# the deployed app's secret-protected ingestion endpoint instead.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://tony-daily.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value set in the hosting provider's env vars
#
# Optional but needed when Vercel Deployment Protection is enabled — without
# it the request is answered by Vercel's login page instead of the app:
#   VERCEL_BYPASS_TOKEN  Vercel → Settings → Deployment Protection →
#                        Protection Bypass for Automation
#
# Notes:
# - GitHub's scheduler is best-effort and can lag at busy times; the app's
#   own 15-minute per-source cooldown keeps it polite to publishers.
# - Scheduled Actions are free and unmetered on PUBLIC repositories. On a
#   private repo each run bills a minimum of one minute, so this cadence
#   (~34 runs/day) uses roughly half the 2,000-minute free allowance —
#   widen the schedule below if you keep the repo private.

on:
  schedule:
    # Every 30 minutes during Hong Kong waking hours (22:00–14:00 UTC
    # ≈ 06:00–22:00 HKT), so we are not hammering feeds overnight.
    - cron: "*/30 22-23,0-14 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news ingestion
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET repository secret is not set."
            exit 1
          fi

          # Deployment Protection, when on, answers unauthenticated requests
          # with an HTML login page. The bypass header is what lets a robot
          # through without opening the dashboard to the public.
          bypass=()
          if [ -n "$VERCEL_BYPASS_TOKEN" ]; then
            bypass=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN")
          fi

          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${bypass[@]}" \
            "$APP_URL/api/cron/ingest")
          echo "HTTP $code"
          # Print the per-source summary. It contains no secrets.
          head -c 2000 /tmp/out.json || true
          echo

          if [ "$code" = "401" ]; then
            echo "Unauthorised: CRON_SECRET here does not match the one deployed."
            exit 1
          fi
          if grep -qi "Authentication Required\|<!DOCTYPE html>" /tmp/out.json 2>/dev/null; then
            echo "Blocked by Deployment Protection. Set VERCEL_BYPASS_TOKEN (see header comment)."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "Ingestion failed."
            exit 1
          fi
